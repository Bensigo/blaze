<!doctype html>
<html lang="en">
<head>

<body><main>
  <small>CONTROLLED DECISION LAB · BUILD v1 · SYNTHETIC</small>

  <button id="left">Choose left</button><button id="right">Choose right</button>

</main><script src="/fixture/decision-validation.js"></script></body>
